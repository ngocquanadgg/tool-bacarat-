<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baccarat AI Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 { text-align: center; color: #f1c40f; margin: 5px 0; font-size: 1.1rem; }

        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Phần hiển thị chuỗi hiện tại */
        .history-container {
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .history-box {
            font-family: monospace;
            font-size: 1.3rem;
            letter-spacing: 3px;
        }
        
        .highlight { color: #f1c40f; font-weight: bold; border-bottom: 2px solid #f1c40f; }

        /* Phần Dự đoán */
        .prediction-box { text-align: center; }
        .pred-title { font-size: 0.8rem; color: #7f8c8d; text-transform: uppercase; }
        .pred-result { font-size: 2.2rem; font-weight: 900; margin: 5px 0; }
        
        .text-banker { color: #e74c3c; } 
        .text-player { color: #3498db; }
        .text-tie { color: #2ecc71; }
        .text-wait { color: #555; font-size: 1.5rem; }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        button {
            border: none;
            border-radius: 8px;
            padding: 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        
        button:active { transform: scale(0.96); opacity: 0.8; }

        .btn-p { background: #2980b9; box-shadow: 0 4px #1a5276; }
        .btn-b { background: #c0392b; box-shadow: 0 4px #922b21; }
        .btn-t { background: #27ae60; box-shadow: 0 4px #1e8449; }
        .btn-undo { background: #7f8c8d; padding: 10px; font-size: 0.9rem; box-shadow: 0 4px #566573; }
        
        /* Action Buttons */
        .action-group { display: flex; gap: 10px; margin-top: auto; }
        .btn-action { flex: 1; padding: 12px; font-size: 0.9rem; box-shadow: none; border: 1px solid #444; }
        .btn-save { background: #d35400; color: #fff; border: none; }
        .btn-new { background: #2c3e50; }

        /* Database Info */
        .db-info { 
            text-align: center; 
            font-size: 0.75rem; 
            color: #666; 
            margin-top: 10px;
            cursor: pointer;
        }
        
        /* Modal Import */
        #importArea { display: none; margin-top: 10px; }
        textarea { width: 100%; height: 50px; background: #333; color: #fff; border: 1px solid #555; }

    </style>
</head>
<body>

    <h2>🔮 BACCARAT AI PRO</h2>

    <div class="card">
        <div class="history-container">
            <div class="history-box" id="currentSeq"></div>
        </div>
        
        <div class="prediction-box">
            <div class="pred-title">AI DỰ ĐOÁN (SOI 6 VÁN)</div>
            <div class="pred-result text-wait" id="prediction">---</div>
            <div id="confidence" style="font-size: 0.8rem; color: #f39c12;">Đang chờ dữ liệu...</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-p" onclick="addResult('P')">PLAYER</button>
        <button class="btn-b" onclick="addResult('B')">BANKER</button>
        <button class="btn-t" onclick="addResult('T')">TIE</button>
    </div>
    <div style="display:flex; justify-content: flex-end; margin-bottom: 10px;">
        <button class="btn-undo" onclick="undo()" style="width: 100px;">⬅️ Xóa sai</button>
    </div>

    <div class="card" style="margin-top: auto;">
        <div class="action-group">
            <button class="btn-action btn-save" onclick="finishAndLearn()">💾 Lưu & Học</button>
            <button class="btn-action btn-new" onclick="resetGame()">🔄 Ván mới</button>
        </div>
        
        <div class="db-info" onclick="toggleImport()">
            <span id="stats">Database: 0 ván</span> <br>
            (Chạm vào đây để nhập tay dữ liệu cũ)
        </div>

        <div id="importArea">
            <textarea id="dbInput" placeholder="Paste chuỗi kết quả cũ vào đây..."></textarea>
            <button class="btn-action" style="background:#555; width:100%; margin-top:5px;" onclick="manualImport()">Nạp thủ công</button>
            <button onclick="clearDatabase()" style="background:none; color:#c0392b; border:none; width:100%; margin-top:10px; font-size:0.7rem;">Xóa sạch bộ nhớ</button>
        </div>
    </div>

    <script>
        const WINDOW_SIZE = 6; 
        let currentSequence = "";
        let database = "";

        // 1. KHỞI TẠO
        window.onload = function() {
            if(localStorage.getItem("baccaratDB_v2")) {
                database = localStorage.getItem("baccaratDB_v2");
            }
            updateStats();
        }

        // 2. XỬ LÝ GAME
        function addResult(res) {
            currentSequence += res;
            updateDisplay();
            analyze();
        }

        function undo() {
            if(currentSequence.length > 0) {
                currentSequence = currentSequence.slice(0, -1);
                updateDisplay();
                analyze();
            }
        }

        function resetGame() {
            if(currentSequence.length > 0) {
                if(confirm("Xóa bàn chơi hiện tại để bắt đầu bàn mới?")) {
                    currentSequence = "";
                    updateDisplay();
                    document.getElementById('prediction').textContent = "---";
                    document.getElementById('prediction').className = "pred-result text-wait";
                    document.getElementById('confidence').textContent = "Sẵn sàng";
                }
            }
        }

        // 3. TÍNH NĂNG: KẾT THÚC & HỌC (QUAN TRỌNG)
        function finishAndLearn() {
            if(currentSequence.length < 10) {
                alert("Bàn chơi quá ngắn, không đáng để học. Hãy chơi thêm!");
                return;
            }

            if(confirm("Lưu bàn chơi này vào bộ não AI để lần sau dự đoán chuẩn hơn?")) {
                database += currentSequence;
                localStorage.setItem("baccaratDB_v2", database);
                
                alert(`✅ Đã nạp thêm ${currentSequence.length} ván kinh nghiệm!`);
                currentSequence = ""; // Reset bàn chơi
                updateDisplay();
                updateStats();
                
                document.getElementById('prediction').textContent = "ĐÃ HỌC";
                document.getElementById('confidence').textContent = "Sẵn sàng cho bàn mới";
            }
        }

        // 4. HIỂN THỊ
        function updateDisplay() {
            let html = "";
            if (currentSequence.length > WINDOW_SIZE) {
                let head = currentSequence.slice(0, -WINDOW_SIZE);
                let tail = currentSequence.slice(-WINDOW_SIZE);
                html = `<span style="color:#555">${head}</span><span class="highlight">${tail}</span>`;
            } else {
                html = `<span class="highlight">${currentSequence}</span>`;
            }
            document.getElementById('currentSeq').innerHTML = html;
            // Auto scroll to right
            let container = document.querySelector('.history-container');
            container.scrollLeft = container.scrollWidth;
        }

        // 5. PHÂN TÍCH LOGIC
        function analyze() {
            const predEl = document.getElementById('prediction');
            const confEl = document.getElementById('confidence');

            if (currentSequence.length < WINDOW_SIZE) {
                predEl.textContent = "WAIT...";
                predEl.className = "pred-result text-wait";
                confEl.textContent = `Cần thêm ${WINDOW_SIZE - currentSequence.length} ván`;
                return;
            }

            const pattern = currentSequence.slice(-WINDOW_SIZE);
            
            // Tìm trong Database
            let nextMoves = [];
            // Quét toàn bộ database
            for (let i = 0; i < database.length - pattern.length; i++) {
                if (database.substring(i, i + pattern.length) === pattern) {
                    let nextChar = database[i + pattern.length];
                    if(nextChar) nextMoves.push(nextChar);
                }
            }

            if (nextMoves.length === 0) {
                predEl.textContent = "KHÔNG RÕ";
                predEl.className = "pred-result text-wait";
                confEl.textContent = "Chưa có dữ liệu về thế bài này.";
                return;
            }

            // Thống kê
            let b = nextMoves.filter(x => x === 'B').length;
            let p = nextMoves.filter(x => x === 'P').length;
            let total = nextMoves.length;
            let bPercent = Math.round((b/total)*100);
            let pPercent = Math.round((p/total)*100);

            confEl.textContent = `Tìm thấy ${total} lần lặp lại trong quá khứ`;

            if (b > p) {
                predEl.textContent = `BANKER ${bPercent}%`;
                predEl.className = "pred-result text-banker";
            } else if (p > b) {
                predEl.textContent = `PLAYER ${pPercent}%`;
                predEl.className = "pred-result text-player";
            } else {
                predEl.textContent = "50 / 50";
                predEl.className = "pred-result text-wait";
            }
        }

        // 6. CÁC HÀM PHỤ
        function updateStats() {
            document.getElementById('stats').textContent = `Database: ${database.length} ván đã học.`;
        }
        
        function manualImport() {
            let input = document.getElementById('dbInput').value.toUpperCase().trim();
            let clean = input.replace(/[^BPT]/g, "");
            if(clean.length > 0) {
                database += clean;
                localStorage.setItem("baccaratDB_v2", database);
                updateStats();
                document.getElementById('dbInput').value = "";
                alert("Đã nạp xong!");
                toggleImport();
            }
        }

        function toggleImport() {
            let el = document.getElementById('importArea');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function clearDatabase() {
            if(confirm("CẢNH BÁO: Bạn sẽ mất toàn bộ kiến thức đã học?")) {
                database = "";
                localStorage.removeItem("baccaratDB_v2");
                updateStats();
            }
        }
    </script>
</body>
</html>
